<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Details</title>

    <link rel="stylesheet" href="css/student-ViewDetails.css">
</head>

<body>

    <div class="page-container">

        <div class="student-card">

            <div class="card-header">
                <h1>Student Details</h1>
                <p>View student information</p>
            </div>


            <div class="search-section">

                <label for="studentid">
                    Student ID
                </label>

                <input
                    type="number"
                    id="studentid"
                    placeholder="Enter Student ID"
                >

                <button onclick="viewStudent()">
                    View Details
                </button>

            </div>


            <div id="result" class="result"></div>


            <div id="studentDetails" class="student-details">

                <div class="detail-item">
                    <span>Student ID</span>
                    <strong id="viewStudentId">-</strong>
                </div>

                <div class="detail-item">
                    <span>Username</span>
                    <strong id="viewUsername">-</strong>
                </div>

                <div class="detail-item">
                    <span>Name</span>
                    <strong id="viewName">-</strong>
                </div>

                <div class="detail-item">
                    <span>Email</span>
                    <strong id="viewEmail">-</strong>
                </div>

                <div class="detail-item">
                    <span>Age</span>
                    <strong id="viewAge">-</strong>
                </div>

                <div class="detail-item">
                    <span>Country</span>
                    <strong id="viewCountry">-</strong>
                </div>

                <div class="detail-item">
                    <span>Plan</span>
                    <strong id="viewPlan">-</strong>
                </div>

                <div class="detail-item">
                    <span>Active Status</span>
                    <strong id="viewActive">-</strong>
                </div>

                <div class="detail-item">
                    <span>Expire At</span>
                    <strong id="viewExpireAt">-</strong>
                </div>

            </div>

        </div>

    </div>


    <script>

        const API_URL = "http://127.0.0.1:5000/students";


        async function viewStudent() {

            const studentid =
                document.getElementById("studentid").value;

            const result =
                document.getElementById("result");


            if (!studentid) {

                result.className = "result error";

                result.textContent =
                    "Please enter Student ID.";

                return;
            }


            result.className = "result";

            result.textContent =
                "Loading student details...";


            try {

                const response = await fetch(
                    `${API_URL}/${studentid}`
                );


                const responseText =
                    await response.text();


                console.log("Status:", response.status);

                console.log(
                    "Response:",
                    responseText
                );


                if (response.ok) {

                    const student =
                        JSON.parse(responseText);


                    document.getElementById(
                        "viewStudentId"
                    ).textContent =
                        student.studentid ?? "-";


                    document.getElementById(
                        "viewUsername"
                    ).textContent =
                        student.username ?? "-";


                    document.getElementById(
                        "viewName"
                    ).textContent =
                        student.name ?? "-";


                    document.getElementById(
                        "viewEmail"
                    ).textContent =
                        student.email ?? "-";


                    document.getElementById(
                        "viewAge"
                    ).textContent =
                        student.age ?? "-";


                    document.getElementById(
                        "viewCountry"
                    ).textContent =
                        student.country ?? "-";


                    document.getElementById(
                        "viewPlan"
                    ).textContent =
                        student.plan ?? "-";


                    document.getElementById(
                        "viewActive"
                    ).textContent =
                        student.is_active
                            ? "Active"
                            : "Inactive";


                    document.getElementById(
                        "viewExpireAt"
                    ).textContent =
                        student.expire_at ?? "-";


                    result.className =
                        "result success";

                    result.textContent =
                        "Student details loaded successfully.";

                }

                else {

                    result.className =
                        "result error";

                    result.textContent =
                        "Student not found: " +
                        responseText;
                }

            }

            catch (error) {

                console.error(
                    "Error:",
                    error
                );


                result.className =
                    "result error";

                result.textContent =
                    "Error: " +
                    error.message;
            }

        }

    </script>

</body>

</html>
