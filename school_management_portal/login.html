<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ABC School</title>

    <link rel="stylesheet" href="css/login.css">

</head>


<body>


    <main>

        <section class="login-section">


            <div class="login-container">


                <!-- LEFT SIDE -->

                <div class="login-brand">

                    <div class="school-logo">
                        🎓
                    </div>

                    <h1>
                        ABC School
                    </h1>

                    <p>
                        School Management System
                    </p>

                    <span>
                        Manage students, teachers and
                        school activities from one place.
                    </span>

                </div>


                <!-- RIGHT SIDE -->

                <div class="login-box">

                    <h2>
                        Welcome Back
                    </h2>

                    <p class="login-subtitle">
                        Please login to your account
                    </p>


                    <form>


                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                            >

                        </div>


                        <!-- REMEMBER + FORGOT -->

                        <div class="login-options">

                            <label class="remember">

                                <input
                                    type="checkbox"
                                    name="remember"
                                >

                                Remember me

                            </label>


                            <a href="#">
                                Forgot Password?
                            </a>

                        </div>


                        <!-- LOGIN BUTTON -->

                        <button type="submit">
                            Login
                        </button>


                    </form>


                    <p class="back-home">

                        <a href="index.html">
                            ← Back to Home
                        </a>

                    </p>

                </div>


            </div>


        </section>

    </main>


</body>

</html>
