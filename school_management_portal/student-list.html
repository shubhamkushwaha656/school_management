<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student List</title>

    <link
        rel="stylesheet"
        href="css/student-list.css">

</head>

<body>


    <div class="student-list-page">

        <div class="student-list-card">


            <!-- HEADER -->

            <div class="student-list-header">

                <div>

                    <h1>Student List</h1>

                    <p>
                        View and manage registered students
                    </p>

                </div>


                <button
                    type="button"
                    class="refresh-button"
                    onclick="loadStudents()">

                    Refresh List

                </button>

            </div>



            <!-- RESULT -->

            <div
                id="result"
                class="result">
            </div>



            <!-- TABLE -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Student ID</th>

                            <th>Username</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Age</th>

                            <th>Country</th>

                            <th>Plan</th>

                            <th>Status</th>

                            <th>Expire At</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody
                        id="studentTableBody">

                    </tbody>

                </table>

            </div>



            <!-- PAGINATION -->

            <div class="pagination">


                <button
                    id="previousButton"
                    class="page-button"
                    onclick="previousPage()">

                    Previous

                </button>


                <span
                    id="pageNumber"
                    class="page-number">

                    Page 1

                </span>


                <button
                    id="nextButton"
                    class="page-button"
                    onclick="nextPage()">

                    Next

                </button>

            </div>


        </div>

    </div>



    <script>


        /* =====================================
           API
           ===================================== */

        const API_URL =
            "http://127.0.0.1:5000/students";


        /* =====================================
           PAGINATION
           ===================================== */

        const LIMIT = 5;

        let currentPage = 1;



        /* =====================================
           LOAD STUDENTS
           ===================================== */

        async function loadStudents() {


            const result =
                document.getElementById(
                    "result"
                );


            const tableBody =
                document.getElementById(
                    "studentTableBody"
                );


            result.className =
                "result loading";


            result.textContent =
                "Loading students...";


            tableBody.innerHTML = "";


            try {


                /*
                GET API WITH LIMIT AND PAGE
                */

                const response =
                    await fetch(
                        `${API_URL}?limit=${LIMIT}&page=${currentPage}`,
                        {
                            method: "GET"
                        }
                    );


                const responseText =
                    await response.text();


                console.log(
                    "GET Status:",
                    response.status
                );


                console.log(
                    "GET Response:",
                    responseText
                );


                if (!response.ok) {

                    result.className =
                        "result error";

                    result.textContent =
                        "Failed to load students.";

                    return;

                }


                const data =
                    JSON.parse(
                        responseText
                    );


                /*
                API can return array
                */

                const students =
                    Array.isArray(data)
                        ? data
                        : data.students;


                if (
                    !students ||
                    students.length === 0
                ) {


                    /*
                    If no data on next page,
                    don't move forward.
                    */

                    if (currentPage > 1) {

                        currentPage--;

                    }


                    result.className =
                        "result error";

                    result.textContent =
                        "No more students found.";

                    updatePagination();

                    return;

                }



                /* =================================
                   DISPLAY STUDENTS
                   ================================= */


                students.forEach(
                    function(student) {


                        const row =
                            document.createElement(
                                "tr"
                            );


                        /*
                        Expire At
                        */

                        let expireAt = "-";


                        if (student.expire_at) {

                            expireAt =
                                String(
                                    student.expire_at
                                );

                        }



                        /*
                        Status
                        */

                        const statusText =
                            student.is_active
                                ? "Active"
                                : "Inactive";


                        const statusClass =
                            student.is_active
                                ? "status-active"
                                : "status-inactive";



                        /*
                        Create Row
                        */

                        row.innerHTML = `

                            <td>
                                ${student.studentid ?? "-"}
                            </td>

                            <td>
                                ${student.username ?? "-"}
                            </td>

                            <td>
                                ${student.name ?? "-"}
                            </td>

                            <td>
                                ${student.email ?? "-"}
                            </td>

                            <td>
                                ${student.age ?? "-"}
                            </td>

                            <td>
                                ${student.country ?? "-"}
                            </td>

                            <td>

                                <span class="plan-badge">

                                    ${student.plan ?? "-"}

                                </span>

                            </td>

                            <td>

                                <span class="${statusClass}">

                                    ${statusText}

                                </span>

                            </td>

                            <td>
                                ${expireAt}
                            </td>


                            <td>

                                <div class="action-buttons">


                                    <button
                                        class="update-button"
                                        onclick="updateStudent(${student.studentid})">

                                        Update

                                    </button>


                                    <button
                                        class="delete-button"
                                        onclick="deleteStudent(${student.studentid})">

                                        Delete

                                    </button>


                                </div>

                            </td>

                        `;


                        tableBody.appendChild(
                            row
                        );

                    }
                );



                /*
                Success
                */

                result.className =
                    "result success";


                result.textContent =
                    `${students.length} student(s) loaded.`;



                /*
                Update pagination
                */

                updatePagination();


            }


            catch (error) {


                console.error(
                    "Error:",
                    error
                );


                result.className =
                    "result error";


                result.textContent =
                    "Error: " +
                    error.message;

            }

        }



        /* =====================================
           PAGINATION UI
           ===================================== */

        function updatePagination() {


            document.getElementById(
                "pageNumber"
            ).textContent =
                `Page ${currentPage}`;


            /*
            Previous disabled on page 1
            */

            document.getElementById(
                "previousButton"
            ).disabled = currentPage === 1;
     
            /*
            Next button

            If less than 10 students
            are returned, this is last page.
            */

            const rows =
                document.querySelectorAll(
                    "#studentTableBody tr"
                );


            document.getElementById(
                "nextButton"
            ).disabled =
                rows.length < LIMIT;

        }



        /* =====================================
           NEXT PAGE
           ===================================== */

        function nextPage() {


            currentPage++;


            loadStudents();

        }



        /* =====================================
           PREVIOUS PAGE
           ===================================== */

        function previousPage() {


            if (currentPage === 1) {

                return;

            }

            currentPage--;


            loadStudents();

        }



        /* =====================================
           UPDATE STUDENT
           ===================================== */

        function updateStudent(studentid) {


            /*
            Open update page
            and send student ID
            */

            window.location.href =
                `student-update.html?studentid=${studentid}`;

        }



        /* =====================================
           DELETE STUDENT
           ===================================== */

        async function deleteStudent(studentid) {


            const confirmDelete =
                confirm(
                    `Are you sure you want to delete Student ID ${studentid}?`
                );


            if (!confirmDelete) {

                return;

            }


            try {


                const response =
                    await fetch(
                        `${API_URL}/${studentid}`,
                        {
                            method: "DELETE"
                        }
                    );


                const responseText =
                    await response.text();


                console.log(
                    "DELETE Status:",
                    response.status
                );


                console.log(
                    "DELETE Response:",
                    responseText
                );


                if (response.ok) {


                    alert(
                        "Student deleted successfully."
                    );


                    /*
                    Reload current page
                    */

                    loadStudents();

                }


                else {


                    alert(
                        "Delete failed: " +
                        responseText
                    );

                }

            }


            catch (error) {


                console.error(
                    "Delete Error:",
                    error
                );


                alert(
                    "Error: " +
                    error.message
                );

            }

        }



        /* =====================================
           FIRST LOAD
           ===================================== */

        loadStudents();


    </script>


</body>

</html>
