
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Management - ABC School</title>

    <link rel="stylesheet" href="css/course-management.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            ABC School
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="student-registration.html">Students</a>
            <a href="student-list.html">Student List</a>
            <a href="course-management.html" class="active">
                Course Management
            </a>
        </div>

    </nav>


    <!-- Main Container -->
    <main class="container">

        <!-- Page Header -->
        <section class="page-header">

            <div>
                <h1>Course Management</h1>
                <p>
                    Create, view, update and delete courses
                    from the ABC School system.
                </p>
            </div>

            <button class="add-btn" onclick="openAddCourse()">
                + Add Course
            </button>

        </section>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <div class="stat-icon">📚</div>

                <div>
                    <h3 id="totalCourses">0</h3>
                    <p>Total Courses</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🎓</div>

                <div>
                    <h3 id="semesterOne">0</h3>
                    <p>Semester 1</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">📖</div>

                <div>
                    <h3 id="semesterTwo">0</h3>
                    <p>Semester 2</p>
                </div>
            </div>

        </section>


        <!-- Course Form -->
        <section class="form-section" id="courseFormSection">

            <div class="section-title">
                <h2 id="formTitle">Add New Course</h2>
                <button
                    class="close-btn"
                    onclick="closeCourseForm()">
                    ×
                </button>
            </div>


            <form id="courseForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="courseId">
                            Course ID
                        </label>

                        <input
                            type="number"
                            id="courseId"
                            placeholder="Enter course ID"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="courseName">
                            Course Name
                        </label>

                        <input
                            type="text"
                            id="courseName"
                            placeholder="Enter course name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="semester">
                            Semester
                        </label>

                        <select id="semester" required>

                            <option value="">
                                Select Semester
                            </option>

                            <option value="1">
                                Semester 1
                            </option>

                            <option value="2">
                                Semester 2
                            </option>

                            <option value="3">
                                Semester 3
                            </option>

                            <option value="4">
                                Semester 4
                            </option>

                            <option value="5">
                                Semester 5
                            </option>

                            <option value="6">
                                Semester 6
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        class="save-btn"
                        id="saveBtn">
                        Save Course
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="closeCourseForm()">
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- Course List -->
        <section class="course-section">

            <div class="course-header">

                <div>
                    <h2>Available Courses</h2>
                    <p>Manage all available courses</p>
                </div>

                <div class="search-box">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search course..."
                        onkeyup="searchCourses()">

                    🔍

                </div>

            </div>


            <!-- Course Cards -->
            <div class="course-grid" id="courseContainer">

                <!-- Courses will be loaded here -->

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script>

        const API_URL =
            "http://127.0.0.1:5000/courses";

        let courses = [];
        let editMode = false;


        // Form elements
        const courseForm =
            document.getElementById("courseForm");

        const formSection =
            document.getElementById("courseFormSection");


        // Load courses
        async function loadCourses() {

            try {

                const response =
                    await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Failed to load courses");
                }

                courses =
                    await response.json();

                displayCourses(courses);

                updateStatistics();

            } catch (error) {

                console.error(error);

                document.getElementById("courseContainer")
                    .innerHTML = `
                        <div class="error-message">
                            Unable to load courses.
                            <br>
                            Make sure FastAPI is running.
                        </div>
                    `;

            }

        }


        // Display courses
        function displayCourses(courseList) {

            const container =
                document.getElementById("courseContainer");

            container.innerHTML = "";

            if (courseList.length === 0) {

                container.innerHTML = `
                    <div class="empty-message">
                        No courses found.
                    </div>
                `;

                return;
            }


            courseList.forEach(course => {

                const card =
                    document.createElement("div");

                card.className = "course-card";

                card.innerHTML = `

                    <div class="course-top">

                        <span class="course-id">
                            ID: ${course.courseId}
                        </span>

                        <span class="semester">
                            Semester ${course.semester}
                        </span>

                    </div>


                    <div class="course-icon">
                        📚
                    </div>


                    <h3>
                        ${course.courseName}
                    </h3>


                    <p>
                        Course ID:
                        <strong>${course.courseId}</strong>
                    </p>


                    <p>
                        Semester:
                        <strong>${course.semester}</strong>
                    </p>


                    <div class="course-actions">

                        <button
                            class="edit-btn"
                            onclick="editCourse(${course.courseId})">
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteCourse(${course.courseId})">
                            Delete
                        </button>

                    </div>

                `;

                container.appendChild(card);

            });

        }


        // Open add form
        function openAddCourse() {

            editMode = false;

            document.getElementById("formTitle")
                .textContent = "Add New Course";

            document.getElementById("saveBtn")
                .textContent = "Save Course";

            courseForm.reset();

            document.getElementById("courseId")
                .disabled = false;

            formSection.style.display = "block";

            formSection.scrollIntoView({
                behavior: "smooth"
            });

        }


        // Close form
        function closeCourseForm() {

            formSection.style.display = "none";

            courseForm.reset();

            editMode = false;

        }


        // Add / Update Course
        courseForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const courseId =
                    Number(
                        document.getElementById("courseId").value
                    );

                const courseName =
                    document.getElementById("courseName").value.trim();

                const semester =
                    Number(
                        document.getElementById("semester").value
                    );


                const courseData = {

                    courseId: courseId,

                    courseName: courseName,

                    semester: semester

                };


                try {

                    let response;


                    if (editMode) {

                        response = await fetch(
                            `${API_URL}/${courseId}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(courseData)
                            }
                        );

                    } else {

                        response = await fetch(
                            API_URL,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(courseData)
                            }
                        );

                    }


                    const result =
                        await response.json();


                    if (!response.ok) {

                        alert(
                            result.detail ||
                            "Operation failed"
                        );

                        return;
                    }


                    alert(
                        editMode
                            ? "Course updated successfully!"
                            : "Course created successfully!"
                    );


                    closeCourseForm();

                    loadCourses();


                } catch (error) {

                    console.error(error);

                    alert(
                        "Server error. Please check FastAPI."
                    );

                }

            }
        );


        // Edit course
        function editCourse(courseId) {

            const course =
                courses.find(
                    c => c.courseId === courseId
                );


            if (!course) {
                return;
            }


            editMode = true;


            document.getElementById("formTitle")
                .textContent = "Update Course";


            document.getElementById("saveBtn")
                .textContent = "Update Course";


            document.getElementById("courseId")
                .value = course.courseId;


            document.getElementById("courseId")
                .disabled = true;


            document.getElementById("courseName")
                .value = course.courseName;


            document.getElementById("semester")
                .value = course.semester;


            formSection.style.display = "block";


            formSection.scrollIntoView({
                behavior: "smooth"
            });

        }


        // Delete course
        async function deleteCourse(courseId) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this course?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/${courseId}`,
                        {
                            method: "DELETE"
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    alert(
                        result.detail ||
                        "Unable to delete course"
                    );

                    return;
                }


                alert(
                    "Course deleted successfully!"
                );


                loadCourses();


            } catch (error) {

                console.error(error);

                alert(
                    "Server error. Please check FastAPI."
                );

            }

        }


        // Search courses
        function searchCourses() {

            const search =
                document.getElementById("searchInput")
                    .value
                    .toLowerCase();


            const filtered =
                courses.filter(course =>

                    course.courseName
                        .toLowerCase()
                        .includes(search)

                    ||

                    String(course.courseId)
                        .includes(search)

                );


            displayCourses(filtered);

        }


        // Statistics
        function updateStatistics() {

            document.getElementById("totalCourses")
                .textContent = courses.length;


            document.getElementById("semesterOne")
                .textContent =
                    courses.filter(
                        c => Number(c.semester) === 1
                    ).length;


            document.getElementById("semesterTwo")
                .textContent =
                    courses.filter(
                        c => Number(c.semester) === 2
                    ).length;

        }


        // Initial load
        loadCourses();

    </script>

</body>

</html>
